name: Deploy to Production

on:
  workflow_dispatch:

jobs:
  deploy-production:
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Copy Files to Production
      run: |
        ssh -i ~/.ssh/deploy_key_prod -o StrictHostKeyChecking=no ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} "
          mkdir -p ~/app
        "

        scp -i ~/.ssh/deploy_key_prod -o StrictHostKeyChecking=no \
          docker-compose.yml \
          Dockerfile.vulnerable \
          -r vulnerable_app \
          ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:~/app/

    - name: Deploy Containers on Production
      run: |
        ssh -i ~/.ssh/deploy_key_prod -o StrictHostKeyChecking=no ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} "
          cd ~/app &&
          sudo docker compose down || true &&
          sudo docker compose up -d --build
        "
