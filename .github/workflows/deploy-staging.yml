name: Deploy to Staging

on:
  push:
    branches:
      - main

jobs:
  deploy-staging:
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Copy Files to Staging
      run: |
        ssh -i ~/.ssh/deploy_key_staging -o StrictHostKeyChecking=no ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} "
          mkdir -p ~/app
        "

        scp -r -i ~/.ssh/deploy_key_staging -o StrictHostKeyChecking=no \
          docker-compose.yml \
          Dockerfile \
          vulnerable_app \
          ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:~/app/

    - name: Deploy Containers on Staging
      run: |
        ssh -i ~/.ssh/deploy_key_staging -o StrictHostKeyChecking=no ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} "
          cd ~/app &&
          sudo docker compose down || true &&
          sudo docker compose up -d --build
        "
